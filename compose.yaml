# OmniCP — the service definitions.
#
# DO NOT EDIT THIS FILE. Anything true of this host and no other goes in
# `compose.override.yaml`, which compose merges on top of this one automatically:
#
#     cp compose.override.yaml.example compose.override.yaml
#
# An edit here is a commit nobody else has, replayed on every update until the day it
# conflicts — and that day is a hand-resolved merge, at speed, on a production system.
#
# Configuration is `.env.production`. Start at INSTALL.md.

name: one-panel

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onepanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-onepanel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-onepanel} -d ${POSTGRES_DB:-onepanel}']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${OMNICP_REGISTRY:-ghcr.io/armar-reggans}/omnicp-tools:${OMNICP_VERSION:-dev}
    build:
      context: .
      target: tools
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PANEL_ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY:?PANEL_ENCRYPTION_KEY is required}
      PANEL_ORIGIN: ${PANEL_ORIGIN:?PANEL_ORIGIN is required}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      OMNICP_VERSION: ${OMNICP_VERSION:-}
    command: ['pnpm', 'db:deploy-all']

  panel:
    image: ${OMNICP_REGISTRY:-ghcr.io/armar-reggans}/omnicp-panel:${OMNICP_VERSION:-dev}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PANEL_ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY:?PANEL_ENCRYPTION_KEY is required}
      PANEL_ORIGIN: ${PANEL_ORIGIN:?PANEL_ORIGIN is required}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      PANEL_STAGING_DIR: /staging
      OMNICP_VERSION: ${OMNICP_VERSION:-}
    volumes:
      - ./one-ca-bundle.pem:/app/one-ca-bundle.pem:ro
      - staging:/staging
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  reconciler:
    image: ${OMNICP_REGISTRY:-ghcr.io/armar-reggans}/omnicp-tools:${OMNICP_VERSION:-dev}
    build:
      context: .
      target: tools
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PANEL_ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY:?PANEL_ENCRYPTION_KEY is required}
      PANEL_ORIGIN: ${PANEL_ORIGIN:?PANEL_ORIGIN is required}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      PANEL_STAGING_DIR: /staging
    volumes:
      - ./one-ca-bundle.pem:/app/one-ca-bundle.pem:ro
      - staging:/staging
    command: ['pnpm', 'reconcile', '--', '--loop']
    healthcheck:
      test: ['CMD', 'pnpm', 'reconcile:health']
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s

  console-proxy:
    image: ${OMNICP_REGISTRY:-ghcr.io/armar-reggans}/omnicp-tools:${OMNICP_VERSION:-dev}
    build:
      context: .
      target: tools
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PANEL_ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY:?PANEL_ENCRYPTION_KEY is required}
      PANEL_ORIGIN: ${PANEL_ORIGIN:?PANEL_ORIGIN is required}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      CONSOLE_PROXY_PORT: '8787'
    volumes:
      - ./one-ca-bundle.pem:/app/one-ca-bundle.pem:ro
    command: ['pnpm', 'console:proxy']

  gatus:
    image: ghcr.io/twin/gatus:v5.37.0
    restart: unless-stopped
    depends_on:
      monitor-worker:
        condition: service_started
    volumes:
      - gatus_config:/config
    deploy:
      resources:
        limits:
          memory: 512M

  monitor-worker:
    image: ${OMNICP_REGISTRY:-ghcr.io/armar-reggans}/omnicp-tools:${OMNICP_VERSION:-dev}
    build:
      context: .
      target: tools
    restart: unless-stopped
    depends_on:
      panel:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PANEL_ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY:?PANEL_ENCRYPTION_KEY is required}
      PANEL_ORIGIN: ${PANEL_ORIGIN:?PANEL_ORIGIN is required}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      MONITOR_PANEL_URL: ${MONITOR_PANEL_URL:-http://panel:3000}
      MONITOR_GATUS_URL: ${MONITOR_GATUS_URL:-http://gatus:8080}
      MONITOR_GATUS_PORT: '8080'
      MONITOR_GATUS_CONFIG: /gatus-config/config.yaml
      MONITOR_WORKER_TOKEN: ${MONITOR_WORKER_TOKEN:-}
      MONITOR_WORKER_NAME: ${MONITOR_WORKER_NAME:-local}
      MONITOR_LOCATION: ${MONITOR_LOCATION:-default}
    volumes:
      - gatus_config:/gatus-config
    command: ['pnpm', 'monitor:worker']

  tools:
    image: ${OMNICP_REGISTRY:-ghcr.io/armar-reggans}/omnicp-tools:${OMNICP_VERSION:-dev}
    build:
      context: .
      target: tools
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PANEL_ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY:?PANEL_ENCRYPTION_KEY is required}
      PANEL_ORIGIN: ${PANEL_ORIGIN:?PANEL_ORIGIN is required}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
    volumes:
      - ./one-ca-bundle.pem:/app/one-ca-bundle.pem:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - panel
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?PANEL_DOMAIN is required}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ${TLS_CERT_DIR:-./certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    command:
      ['caddy', 'run', '--adapter', 'caddyfile', '--config', '/etc/caddy/${TLS_MODE:-acme}.Caddyfile']

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  gatus_config:
  staging:
